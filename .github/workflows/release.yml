name: Release

# Publica una versión al empujar un tag vX.Y.Z. El zip sale de `git archive`, así que contiene
# exactamente lo que hay en el repositorio en ese tag, sin nada del runner.
on:
  push:
    tags: ['v*.*.*']

permissions: read-all

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Los permisos de escritura van solo en este job, que es el único que los necesita: crear la
    # release y firmar la atestación de procedencia con el token OIDC.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Actions fijadas por SHA de commit completo. Para subirlas, resolver el tag nuevo con
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha` y desreferenciarlo si
      # el objeto es de tipo `tag`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Empaquetar
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=zip --prefix="aduana-${version}/" -o "dist/aduana-${version}.zip" "$GITHUB_REF_NAME"
          (cd dist && sha256sum "aduana-${version}.zip" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aduana-*.zip

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Aduana $GITHUB_REF_NAME" --verify-tag --generate-notes
